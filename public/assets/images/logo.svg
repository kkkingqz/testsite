<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80">
  <defs>
    <!-- Градиент фона фирменного знака -->
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181e26"/>
      <stop offset="100%" stop-color="#0c0f13"/>
    </linearGradient>

    <!-- Акцентный неоново-синий градиент (цвет интерфейсов и оптики) -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <style>
      .brand-title {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        fill: #f8fafc;
      }
      .brand-subtitle {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        fill: #94a3b8;
      }
    </style>
  </defs>

  <!-- 1. ИКОНИЧЕСКИЙ ЗНАК / ШЕВРОН (слева, 56x56 px с отступом) -->
  <g transform="translate(12, 12)">
    <!-- Подложка плашки -->
    <rect width="56" height="56" rx="12" fill="url(#badge-grad)"/>
    <!-- Рамка знака -->
    <rect x="1" y="1" width="54" height="54" rx="11" fill="none" stroke="#25303d" stroke-width="1.2"/>

    <!-- Тактический шеврон «K» -->
    <!-- Вертикальная опора -->
    <path d="M 17 13 L 23 13 L 23 43 L 17 43 Z" fill="#ffffff"/>
    <!-- Верхний диагональный скос -->
    <path d="M 25 28 L 34 15 L 42 15 L 30 31 Z" fill="#ffffff"/>
    <!-- Нижний акцентный скос -->
    <path d="M 29 30 L 41 43 L 33 43 L 24 33 Z" fill="url(#accent-cyan)"/>
    <!-- Угловой маркер-прицел -->
    <path d="M 39 12 L 44 12 L 44 17" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- 2. РАЗДЕЛИТЕЛЬНАЯ ТАКТИЧЕСКАЯ ЛИНИЯ -->
  <line x1="80" y1="20" x2="80" y2="60" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="2 3"/>

  <!-- 3. ТЕКСТОВАЯ ЧАСТЬ (KTAWF + ДЕСКРИПТОР) -->
  <!-- Основное название -->
  <text x="94" y="44" font-size="25" class="brand-title">KTAWF</text>
  
  <!-- Дескриптор / подпись направления -->
  <text x="95" y="58" font-size="7.5" class="brand-subtitle">GLOBAL SECURITY &amp; TACTICAL</text>

  <!-- Маленький тактический индикатор готовности (статус онлайн) -->
  <circle cx="214" cy="27" r="2.5" fill="#38bdf8"/>
</svg>
